<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Icons</title></head>
<body>
<main>
  <h1>Toolbar</h1>
  <div><button id="fa"><i class="fas fa-trash fa-fw"></i></button></div>
  <div><button id="svgt"><svg width="16" height="16"><title>Close dialog</title><path d="M0 0L10 10"/></svg></button></div>
  <div><button id="mat"><span class="material-icons">settings</span></button></div>
  <div><button id="bare"><svg width="16" height="16"><path d="M0 0L10 10"/></svg></button></div>
  <div><button id="tip" data-tooltip="Share this page"><svg width="16" height="16"><path d="M0 0L10 10"/></svg></button></div>
  <div><button id="bi" class="bi bi-search"></button></div>
  <div><a id="vote" href="/vote?id=7&how=up&goto=news"><span class="arrow" style="display:inline-block;width:10px;height:10px;background:#999"></span></a></div>
  <div><a id="tw" href="https://twitter.com/acme"><svg width="16" height="16"><path d="M0 0L10 10"/></svg></a></div>
  <div><button id="text">Save <i class="fa fa-floppy"></i></button></div>
</main>
</body>
</html>
