<!doctype html><html><head><title>Verify</title></head><body>
<main>
  <h1>Verify</h1>
  <div id="gate" style="width:200px;height:60px">Checking you are human</div>
  <button id="go">Continue</button>
</main>
<script>
  setTimeout(() => document.getElementById('gate').remove(), 1200);
  setTimeout(() => {
    const b = document.createElement('button');
    b.id = 'later';
    b.textContent = 'Welcome back';
    document.querySelector('main').appendChild(b);
  }, 1400);
</script>
</body></html>
