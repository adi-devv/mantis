<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Hidden things</title></head>
<body>
<button>Visible one</button>
<button style="display:none">Display none</button>
<button style="visibility:hidden">Visibility hidden</button>
<button aria-hidden="true">Aria hidden</button>
<button style="opacity:0">Opacity zero</button>
<button style="width:0;height:0;padding:0;border:0;overflow:hidden">Zero size</button>
<div style="position:absolute;left:-9999px"><button>Offscreen left</button></div>
<div style="position:absolute;top:-9999px"><button>Offscreen above</button></div>
<div inert><button>Inert one</button></div>
<div hidden><button>Hidden attribute</button></div>
<div style="display:none"><h2>Hidden heading</h2></div>
<div style="height:0;overflow:hidden"><a href="/collapsed">Collapsed panel link</a></div>
<a href="/visible">Visible link</a>
<div style="height:3000px"></div>
<button>Below the fold</button>
</body>
</html>
