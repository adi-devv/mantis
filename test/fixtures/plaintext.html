<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Pricing</title></head>
<body>
  <header><nav aria-label="Main"><a href="#home">Home</a> <a href="#pricing">Pricing</a></nav></header>
  <main>
    <h1>Pricing</h1>
    <ul><li>Starter: $9 per month</li><li>Team: $29 per month</li><li>Enterprise: contact us</li></ul>
    <form id="f" aria-label="Subscribe">
      <label for="c">Country</label>
      <select id="c"><option>Choose…</option><option>Canada</option></select>
      <button type="submit">Subscribe</button>
    </form>
    <p id="out"></p>
  </main>
  <footer><p>© Example Corp</p></footer>
  <script>
    document.getElementById('f').addEventListener('submit', (e) => {
      e.preventDefault();
      document.getElementById('out').textContent = 'Subscribed from ' + document.getElementById('c').value + '.';
    });
  </script>
</body>
</html>
