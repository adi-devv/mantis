<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Opacity controls</title>
<style>
  body { font: 16px sans-serif; margin: 0; }
  .row { position: relative; display: flex; align-items: center; gap: 12px; padding: 12px; }
  .b-select { opacity: 0; }
  .b-select select { width: 166px; height: 48px; }
</style>
</head>
<body>
<main>
  <h1>Shop</h1>
  <div class="row">
    <label for="plp-sort">Sort by</label>
    <div class="b-select">
      <select id="plp-sort" name="sort-order">
        <option selected>Bestseller</option>
        <option>Newest</option>
        <option>Price</option>
      </select>
    </div>
  </div>

</main>
</body>
</html>
