<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Swatch near-misses</title>
<style>
  body { font: 16px sans-serif; margin: 0; }
  .row { position: relative; display: flex; align-items: center; height: 30px; width: 400px; margin: 8px 0; }
  .row input.ghost { position: absolute; inset: 0; opacity: 0; margin: 0; width: 100%; height: 100%; }
  /* (a) an ordinary opaque card sits over the transparent input: it is not the click target */
  #a .card { position: absolute; inset: 0; background: #eee; z-index: 2; }
  #d1 input.ghost { visibility: hidden; }
  #d2 input.ghost { pointer-events: none; }
  .visually-hidden { position: absolute; overflow: hidden; width: 1px; height: 1px; margin: -1px; clip: rect(0, 0, 0, 0); }
</style>
</head>
<body>
<main>
  <h1>Near misses</h1>
  <div class="row" id="a">
    <input class="ghost" type="checkbox" aria-label="Covered ghost" id="a1">
    <span>Covered row text</span>
    <div class="card">Card on top</div>
  </div>
  <div class="row" id="b">
    <input type="checkbox" id="b1" aria-label="SKU-1234 blue">
    <span>Ignored row words</span>
  </div>
  <ul style="list-style:none;padding:0">
    <li class="row" id="c"><input type="checkbox" aria-label="gid://shopify/Metaobject/111222333444" id="c1"><input type="checkbox" aria-label="gid://shopify/Metaobject/555666777888" id="c2"><span>Shared row words</span></li>
  </ul>
  <div class="row" id="d1"><input class="ghost" type="checkbox" aria-label="Invisible ghost"><span>Visibility row text</span></div>
  <div class="row" id="d2"><input class="ghost" type="checkbox" aria-label="Inert ghost"><span>Pointer row text</span></div>
</main>
</body>
</html>
