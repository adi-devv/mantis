<!doctype html>
<html><head><meta charset="utf-8"><title>Busy carousel and analytics</title>
<style>body { font: 16px sans-serif; margin: 20px; } ul { list-style: none; padding: 0; display: flex; gap: 8px; } .slide { width: 60px; height: 30px; background: #cde; } .menu-item.open { font-weight: bold; }</style></head>
<body>
<h1>Collections</h1>
<ul id="slides">
  <li class="slide" tabindex="0">1</li><li class="slide" tabindex="-1">2</li><li class="slide" tabindex="-1">3</li><li class="slide" tabindex="-1">4</li>
  <li class="slide" tabindex="-1">5</li><li class="slide" tabindex="-1">6</li><li class="slide" tabindex="-1">7</li><li class="slide" tabindex="-1">8</li>
</ul>
<button id="reveal" type="button">Reveal panel</button>
<button id="menu" type="button">Open menu</button>
<ul id="items"><li class="menu-item">A</li><li class="menu-item">B</li><li class="menu-item">C</li><li class="menu-item">D</li><li class="menu-item">E</li><li class="menu-item">F</li></ul>
<div id="out"></div>
<script>
// Carousel: every 80ms the active slide moves, touching tabindex, aria-hidden and style on a different pair of slides.
const slides = Array.from(document.querySelectorAll('.slide'));
let cur = 0;
setInterval(() => {
  const prev = slides[cur];
  cur = (cur + 1) % slides.length;
  const next = slides[cur];
  prev.setAttribute('tabindex', '-1'); prev.setAttribute('aria-hidden', 'true'); prev.style.opacity = '0.5';
  next.setAttribute('tabindex', '0'); next.setAttribute('aria-hidden', 'false'); next.style.opacity = '1';
}, 80);
// Analytics: keeps injecting scripts and styles into <head>.
let n = 0;
setInterval(() => {
  n++;
  const el = document.createElement(n % 2 ? 'script' : 'style');
  el.textContent = '/* ' + n + ' */';
  document.head.appendChild(el);
}, 50);
document.getElementById('reveal').addEventListener('click', () => {
  setTimeout(() => { const p = document.createElement('p'); p.textContent = 'Panel text'; document.getElementById('out').appendChild(p); }, 300);
});
// Near miss: one burst of class changes on six siblings, then the real content 200ms later.
document.getElementById('menu').addEventListener('click', () => {
  document.querySelectorAll('.menu-item').forEach((li) => li.classList.add('open'));
  setTimeout(() => { const p = document.createElement('p'); p.textContent = 'Menu ready'; document.getElementById('out').appendChild(p); }, 200);
});
</script>
</body></html>
