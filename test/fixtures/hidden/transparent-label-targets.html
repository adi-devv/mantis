<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Transparent control targets</title>
  <style>
    body { font: 16px sans-serif; margin: 32px; }
    .option { position: relative; width: 240px; height: 44px; margin: 12px 0; }
    input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; z-index: 1; }
    label { display: grid; place-items: center; height: 100%; border: 1px solid #777; border-radius: 4px; }
    .label-on-top label { position: relative; z-index: 2; }
  </style>
</head>
<body>
  <h1>Targets</h1>
  <div class="option">
    <input id="direct-control" type="checkbox"><label for="direct-control">Direct target</label>
  </div>
  <p id="direct-state">Direct: unchecked</p>
  <div class="option label-on-top">
    <input id="label-control" type="checkbox"><label id="top-label" for="label-control">Label target</label>
  </div>
  <p id="label-state">Label: unchecked</p>
  <script>
    let pointerTarget = '';
    document.addEventListener('pointerdown', (event) => { pointerTarget = event.target.id; }, true);
    for (const [inputId, stateId, name] of [
      ['direct-control', 'direct-state', 'Direct'],
      ['label-control', 'label-state', 'Label'],
    ]) {
      const input = document.getElementById(inputId);
      input.addEventListener('change', () => {
        document.getElementById(stateId).textContent = `${name}: ${input.checked ? 'checked' : 'unchecked'} by ${pointerTarget}`;
      });
    }
  </script>
</body>
</html>
