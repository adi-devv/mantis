<!doctype html>
<html><head><meta charset="utf-8"><title>Signup popup in a shadow root</title>
<style>body { font: 16px sans-serif; margin: 20px; }</style></head>
<body>
<h1>Swimwear</h1>
<button id="buy" onclick="document.getElementById('out').textContent = 'Bought'">Buy now</button>
<button class="filter-disclosure-btn"><svg width="14" height="14"><path d="M0 0h14v14H0z"/></svg></button>
<button class="panel-closed"><svg width="14" height="14"><path d="M0 0h14v14H0z"/></svg></button>
<p id="out"></p>
<!-- Static host; the fixed, page-covering content lives in its shadow root (like Speedo's acquisition-overlay). -->
<signup-overlay></signup-overlay>
<script>
customElements.define('signup-overlay', class extends HTMLElement {
  connectedCallback() {
    const root = this.attachShadow({ mode: 'open' });
    root.innerHTML = `
      <style>
        .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); }
        .panel { position: fixed; top: 80px; left: 80px; width: 400px; padding: 20px; background: #fff; }
        .close-btn { position: absolute; top: 4px; right: 4px; width: 32px; height: 32px; }
      </style>
      <div class="backdrop"></div>
      <div class="panel">
        <div role="dialog" aria-modal="true" aria-label="Get 20% off">
          <p>Sign up for 20% off</p>
          <input type="email" aria-label="Email address">
          <button>Sign up</button>
        </div>
        <button class="close-btn" type="button"><svg width="20" height="20"><path d="M1 1l18 18M19 1L1 19" stroke="black"/></svg></button>
      </div>`;
    root.querySelector('.close-btn').addEventListener('click', () => this.remove());
  }
});
</script>
</body></html>
