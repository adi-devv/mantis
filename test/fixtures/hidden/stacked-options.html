<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Choose a size</title>
  <style>
    body { font: 16px sans-serif; margin: 32px; }
    fieldset { position: relative; display: grid; grid-template-columns: repeat(3, 76px); gap: 10px; width: max-content; }
    label { display: grid; place-items: center; box-sizing: border-box; min-width: 70px; min-height: 40px; border: 1px solid #777; border-radius: 4px; }
    body:not(.normal) input { position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; }
    body.normal label { display: flex; align-items: center; padding: 8px 8px 8px 32px; }
    body.normal input { position: absolute; width: 16px; height: 16px; z-index: 2; }
    #state { margin-top: 20px; }
    #grid-cover { display: none; }
    body.overlay #grid-cover { display: block; position: fixed; left: 32px; top: 66px; width: 258px; height: 118px; z-index: 20; background: rgba(30, 30, 30, .85); color: white; padding: 12px; }
    #option-cover { display: none; }
    body.normal #option-cover { display: block; position: absolute; z-index: 5; background: #ddd; }
  </style>
</head>
<body>
  <h1>Choose a size</h1>
  <fieldset>
    <legend>Size</legend>
    <input id="size-18" type="radio" name="size" value="18" checked><label for="size-18">18</label>
    <input id="size-20" type="radio" name="size" value="20"><label for="size-20">20</label>
    <input id="size-22" type="radio" name="size" value="22"><label for="size-22">22</label>
    <input id="size-24" type="radio" name="size" value="24"><label id="option-24" for="size-24">24</label>
    <input id="size-26" type="radio" name="size" value="26"><label for="size-26">26</label>
    <input id="size-28" type="radio" name="size" value="28"><label for="size-28">28</label>
    <div id="option-cover" aria-hidden="true"></div>
  </fieldset>
  <div id="grid-cover">Options are temporarily covered</div>
  <p id="state" role="status" aria-live="polite">Size: 18</p>
  <script>
    const mode = new URLSearchParams(location.search);
    if (mode.has('overlay')) document.body.classList.add('overlay');
    if (mode.has('normal')) {
      document.body.classList.add('normal');
      document.querySelectorAll('input[name="size"]').forEach((input) => {
        const label = document.querySelector(`label[for="${input.id}"]`);
        input.style.left = `${label.offsetLeft + 9}px`;
        input.style.top = `${label.offsetTop + (label.offsetHeight - 16) / 2}px`;
      });
      const covered = document.querySelector('#option-24');
      const cover = document.querySelector('#option-cover');
      cover.style.left = `${covered.offsetLeft}px`;
      cover.style.top = `${covered.offsetTop}px`;
      cover.style.width = `${covered.offsetWidth}px`;
      cover.style.height = `${covered.offsetHeight}px`;
    }
    document.querySelectorAll('input[name="size"]').forEach((input) => input.addEventListener('change', () => {
      document.querySelector('#state').textContent = `Size: ${input.value}`;
    }));
  </script>
</body>
</html>
