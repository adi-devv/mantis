<!doctype html>
<html><head><meta charset="utf-8"><title>Overlay over the page</title>
<style>
  body { font: 16px sans-serif; margin: 20px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 10; }
  .modal-overlay .box { position: fixed; top: 300px; left: 300px; width: 300px; padding: 20px; background: #fff; }
</style></head>
<body>
<h1>Shop</h1>
<button id="buy" type="button" onclick="document.getElementById('out').textContent = 'Bought'">Buy now</button>
<label class="wrap"><button id="inner" type="button" onclick="document.getElementById('out').textContent = 'Inner clicked'"><span class="icon">Star</span> <span class="txt">Favourite</span></button></label>
<p id="out"></p>
<script>
// Default: a newsletter dialog covers the page. Any ?query: no dialog; coverBriefly() covers it for 300ms.
function cover(ms) {
  const o = document.createElement('div');
  o.id = 'overlay';
  o.className = 'modal-overlay';
  o.setAttribute('role', 'dialog');
  o.setAttribute('aria-label', 'Newsletter');
  o.innerHTML = '<div class="box"><p>Join our newsletter</p><button type="button" aria-label="Close">Close</button></div>';
  o.querySelector('button').addEventListener('click', () => o.remove());
  document.body.appendChild(o);
  if (ms) setTimeout(() => o.remove(), ms);
}
window.coverBriefly = () => cover(300);
if (!location.search) cover(0);
</script>
</body></html>
