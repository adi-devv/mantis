<!doctype html>
<html><head><title>Collapsed options</title></head><body>
<main>
  <button id="colour-trigger" aria-expanded="false" aria-controls="colour-options">Colour</button>
  <div id="colour-options">
    <label>Black (414 products)<input type="checkbox" style="display:none"></label>
    <label>Blue (108 products)<input type="checkbox" style="display:none"></label>
  </div>
  <button id="size-trigger" aria-expanded="true" aria-controls="size-options">Size</button>
  <div id="size-options"><label><input type="checkbox"> Small</label></div>
  <p>Black ink is archival.</p>
</main>
</body></html>
