<!doctype html><html><head><title>Chart</title></head><body>
<main>
  <h1>Sales dashboard</h1>
  <canvas id="c" width="500" height="250"></canvas>
</main>
<script src="vendor/chart.umd.js"></script>
<script>
  new Chart(document.getElementById('c'), {
    type: 'bar',
    data: {
      labels: ['Jan', 'Feb', 'Mar'],
      datasets: [
        { label: 'Sales', data: [10, 20, 30] },
        { label: 'Cost', data: [5, 8, 13] },
      ],
    },
    options: { animation: false, responsive: false, plugins: { title: { display: true, text: 'Q1 numbers' } } },
  });
</script>
</body></html>
